
name: Update emagram forecast

on:
  schedule:
    # 08:00 JST
    - cron: "15 23 * * *"
    # 20:00 JST
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emagram-forecast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Open-Meteo forecast
        run: python fetch_forecast.py

      - name: Commit forecast.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json
          if git diff --cached --quiet; then
            echo "forecast.json has no changes"
          else
            git commit -m "Update forecast data"
            git push
          fi
